<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SalonMind — offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f4;color:#2a1527;font:15px/1.5 Inter,system-ui,sans-serif}
  .c{max-width:420px;text-align:center;padding:32px}
  h1{font:600 26px/1.2 "Playfair Display",Georgia,serif;margin:16px 0 8px}
  p{color:#2a152799}
  button{margin-top:16px;border:0;border-radius:12px;padding:10px 20px;color:#fff;font-weight:600;background:linear-gradient(135deg,#b76e79,#94402e);cursor:pointer}
</style></head>
<body><div class="c">
  <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b1e38"/><stop offset="1" stop-color="#94402e"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><g fill="none" stroke="#e8cf8f" stroke-width="3.2" stroke-linecap="round"><circle cx="22" cy="42" r="6"/><circle cx="42" cy="42" r="6"/><path d="M26.5 37.5 44 16M37.5 37.5 20 16"/></g></svg>
  <h1>You're offline</h1>
  <p>SalonMind needs the internet to show your live bookings. We'll reconnect as soon as you're back online.</p>
  <button id="r">Try again</button>
</div>
<script>
  const target = new URLSearchParams(location.search).get("retry") || "https://salonmind-khaki.vercel.app/app";
  const go = () => { location.href = target; };
  document.getElementById("r").onclick = go;
  window.addEventListener("online", go);
</script>
</body></html>
