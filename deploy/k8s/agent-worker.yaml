# Agent-mesh consumer microservice. Safe to run many replicas: events are claimed with an atomic
# pending→processing update, so no event is processed twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: salonmind
  labels: { app.kubernetes.io/name: agent-worker, app.kubernetes.io/part-of: salonmind }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: agent-worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: agent-worker, app.kubernetes.io/part-of: salonmind }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent-worker
          image: salonmind-worker:local       # e.g. asia-south1-docker.pkg.dev/<project>/salonmind/agent-worker:<sha>
          imagePullPolicy: IfNotPresent
          ports: [{ name: metrics, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: salonmind-config } }, { secretRef: { name: salonmind-secrets } }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
          readinessProbe: { httpGet: { path: /readyz, port: metrics }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: metrics }, initialDelaySeconds: 15, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: agent-worker, namespace: salonmind }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agent-worker }
  minReplicas: 1
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
---
apiVersion: v1
kind: Service
metadata: { name: agent-worker, namespace: salonmind }
spec:
  selector: { app.kubernetes.io/name: agent-worker }
  ports: [{ name: metrics, port: 8080, targetPort: metrics }]
