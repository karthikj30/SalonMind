apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: salonmind
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: salonmind }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: web } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: salonmind } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: web } } }
      containers:
        - name: web
          image: salonmind-web:local          # e.g. asia-south1-docker.pkg.dev/<project>/salonmind/web:<sha>
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: salonmind-config } }, { secretRef: { name: salonmind-secrets } }]
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
          readinessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /login, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: salonmind }
spec:
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Festival-season spikes (Diwali, wedding season): scale web pods on CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web, namespace: salonmind }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 30 }] }
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: web, namespace: salonmind }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: web } } }
