# Copy to secret.yaml (git-ignored), fill in, then `kubectl apply -f secret.yaml`.
# On GKE/EKS prefer Secret Manager / AWS Secrets Manager via the CSI driver or External Secrets.
apiVersion: v1
kind: Secret
metadata: { name: salonmind-secrets, namespace: salonmind }
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_..."
  AGENT_BOT_PASSWORD: "..."
  CRON_SECRET: "..."
  DATA_ENCRYPTION_KEY: "base64-32-bytes"   # AES-256-GCM field encryption (openssl rand -base64 32)
  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
