name: Apps (Android + desktop)

# Builds the Android app (Trusted Web Activity) and the desktop app (Electron) whenever apps/ changes, and
# publishes them on a GitHub release. Both apps load the live site, so website releases need no app build.
on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      # The same key must sign every release or phones refuse the in-place update. Add these repository secrets
      # (Settings → Secrets and variables → Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_PASSWORD. Without them the job still compiles the app, unsigned, as a check.
      - name: Restore signing key
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building an unsigned APK (not published)."
          fi
      - name: Build release APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: salonmind
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          v=$(node -p "require('./apps/version.json').android.versionName")
          mkdir -p out
          if [ -f apps/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/android/app/build/outputs/apk/release/app-release.apk "out/SalonMind-$v.apk"
          else
            cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "out/SalonMind-$v-unsigned.apk"
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk, if-no-files-found: error }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - name: Build installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned builds (code-signing certificates are paid)
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Version
        id: v
        run: |
          echo "desktop=$(node -p "require('./apps/version.json').desktop.version")" >> "$GITHUB_OUTPUT"
          echo "code=$(node -p "require('./apps/version.json').android.versionCode")" >> "$GITHUB_OUTPUT"
          rm -f dist/*-unsigned.apk   # only a properly signed APK can update installed apps
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-v${{ steps.v.outputs.desktop }}-${{ steps.v.outputs.code }}
          name: SalonMind apps ${{ steps.v.outputs.desktop }} (Android build ${{ steps.v.outputs.code }})
          make_latest: true
          files: dist/*
          body: |
            **Android:** install `SalonMind-*.apk` (or download it from the website's *Get the app* page).
            **Windows:** `SalonMind-*-win-x64.exe` · **Mac:** `SalonMind-*-mac-universal.dmg` (unsigned: right-click → Open the first time) · **Linux:** `.AppImage` or `.deb`.

            The apps open the live SalonMind site, so every website update reaches them automatically — no reinstall.
