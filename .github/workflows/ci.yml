name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      # Real-DB integration tests run only when the repo has these secrets configured
      - name: Integration tests (real Supabase)
        if: ${{ env.AGENT_BOT_PASSWORD != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          AGENT_BOT_EMAIL: ${{ secrets.AGENT_BOT_EMAIL }}
          AGENT_BOT_PASSWORD: ${{ secrets.AGENT_BOT_PASSWORD }}
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 tests/integration/*.test.mts
